name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned to exact commits (tags can be moved), with the version in a comment.
# Dependabot (.github/dependabot.yml) proposes updates weekly.

jobs:
  lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.0', '7.1', '7.2', '7.3', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint every PHP file
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

  docs:
    name: README diagrams parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit --no-fund mermaid@11 jsdom
      - run: node tests/check-mermaid.mjs README.md
      - name: README and readme.txt show the plugin's version
        run: |
          V=$(sed -n 's/^ \* Version: *//p' jat-shell-scanner.php | tr -d '[:space:]')
          grep -q "Current version: $V" README.md || { echo "::error file=README.md::README says a different version than the plugin ($V). Update 'Current version' and 'What's new'."; exit 1; }
          grep -q "^Stable tag: $V$" readme.txt || { echo "::error file=readme.txt::readme.txt Stable tag isn't $V."; exit 1; }
          grep -q "^## \[$V\]" CHANGELOG.md || { echo "::error file=CHANGELOG.md::CHANGELOG.md has no entry for $V."; exit 1; }

  plugin-check:
    name: WordPress.org Plugin Check
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Build the WordPress.org edition
        run: bash .github/scripts/build-wporg.sh build

      # The same checks the WordPress.org review team runs. Errors fail the job.
      - uses: WordPress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: './build/jat-shell-scanner'
          slug: 'jat-shell-scanner'
          ignore-warnings: 'true'

  false-positives:
    name: No false alarms on popular plugins
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none
      - name: Fetch WordPress core and popular plugins
        run: |
          mkdir corpus && cd corpus
          for r in WordPress/WordPress Yoast/wordpress-seo elementor/elementor takayukister/contact-form-7 woocommerce/woocommerce Automattic/wp-super-cache Automattic/jetpack; do
            git clone --quiet --depth 1 "https://github.com/$r" "$(basename "$r")"
          done

      - name: Fetch the wordpress.org zips sites actually install
        # What a freshly installed plugin or theme puts on a site: security, backup, cache,
        # snippet, SEO, form, management and migration tools write the files most often mistaken for malware.
        run: |
          mkdir -p corpus/wporg && cd corpus/wporg
          plugins="akismet wordfence all-in-one-wp-security-and-firewall better-wp-security sucuri-scanner malcare-security really-simple-ssl
            updraftplus all-in-one-wp-migration duplicator wpvivid-backuprestore backwpup wp-staging
            litespeed-cache w3-total-cache wp-fastest-cache wp-optimize autoptimize hummingbird-performance jetpack-boost wp-cloudflare-page-cache
            code-snippets insert-headers-and-footers wp-file-manager wp-all-import redirection
            seo-by-rank-math all-in-one-seo-pack google-site-kit google-analytics-for-wordpress
            wpforms-lite ninja-forms formidable essential-addons-for-elementor-lite wp-mail-smtp
            worker mainwp-child health-check query-monitor classic-editor advanced-custom-fields loco-translate
            wp-smushit ewww-image-optimizer regenerate-thumbnails duplicate-post wp-crontrol user-role-editor
            limit-login-attempts-reloaded two-factor mailpoet the-events-calendar bbpress buddypress"
          themes="astra kadence generatepress oceanwp hello-elementor blocksy neve"
          { for p in $plugins; do echo "plugin/$p.latest-stable.zip"; done; for t in $themes; do echo "theme/$t.zip"; done; } |
            xargs -P 8 -I{} sh -c 'f=$(echo "{}" | tr / _); curl -fsSL --retry 3 -o "$f" "https://downloads.wordpress.org/{}" || echo "::warning::Couldn'"'"'t download {}"'
          for z in *.zip; do unzip -q -o "$z" -d "${z%.zip}" && rm "$z"; done
          echo "Plugins and themes: $(ls | wc -l), PHP files: $(find . -name '*.php' | wc -l)"
      - name: Run the code signatures over them
        run: php tests/false-positives.php corpus

  integration:
    name: WP ${{ matrix.wp }} · PHP ${{ matrix.php }}
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { wp: 'latest', php: '8.4', mysql: '8.0', wpcli: 'wp-cli' }
          - { wp: 'latest', php: '7.4', mysql: '8.0', wpcli: 'wp-cli' }
          - { wp: '7.0',    php: '8.3', mysql: '8.0', wpcli: 'wp-cli' }       # "7.0" with no .0 suffix — vulnerable to wp2shell
          - { wp: '7.0.1',  php: '8.3', mysql: '8.0', wpcli: 'wp-cli' }       # vulnerable to wp2shell
          - { wp: '6.9.4',  php: '8.2', mysql: '8.0', wpcli: 'wp-cli' }       # vulnerable to wp2shell
          - { wp: '6.4',    php: '7.0', mysql: '5.7', wpcli: 'wp-cli:2.10.0' } # oldest supported PHP
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wp
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, zip
          tools: ${{ matrix.wpcli }}
          coverage: none

      - name: Build plugin zip (same as a release)
        run: git archive --format=zip --prefix=jat-shell-scanner/ -o jat-shell-scanner.zip HEAD

      - name: Install WordPress ${{ matrix.wp }}
        run: |
          mkdir site
          wp core download --path=site --version=${{ matrix.wp }}
          wp config create --path=site --dbname=wp --dbuser=root --dbpass=root --dbhost=127.0.0.1
          wp config set WP_DEBUG true --raw --path=site
          wp config set WP_DEBUG_LOG true --raw --path=site
          wp config set WP_DEBUG_DISPLAY false --raw --path=site
          wp core install --path=site --url=http://localhost --title=CI --admin_user=admin --admin_password=password --admin_email=ci@example.com --skip-email
          wp plugin install ./jat-shell-scanner.zip --activate --path=site

      - name: Integration tests
        run: bash tests/integration.sh "$PWD/site"

      - name: No PHP notices or errors from the plugin
        if: always()
        run: |
          touch site/wp-content/debug.log
          # Anything from the plugin, or any deprecated-function notice (those name WordPress's file, not ours).
          if grep -v 'simulated crash' site/wp-content/debug.log | grep -iE 'jat-shell-scanner|is <strong>deprecated|deprecated since version'; then exit 1; fi
          echo "clean"
