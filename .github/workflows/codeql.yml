name: CodeQL

# Scans the GitHub Actions workflows for security problems: untrusted input in
# run steps (script injection), over-broad tokens, risky triggers. CodeQL has
# no PHP support; the plugin's own code is covered by CI (Plugin Check, the
# reviewers' phpcs ruleset, integration and false-positive tests).
on:
  push:
    branches: [main]
    paths: ['.github/**']
  pull_request:
    paths: ['.github/**']
  schedule:
    - cron: '17 9 * * 1'   # Mondays, after Dependabot's run
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload results to the Security tab
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: actions
          queries: security-extended

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:actions
