name: Release

# Releases happen automatically: when CI passes on main and the plugin's
# version has no release yet, this tags vX.Y.Z and publishes the zip, its
# SHA-256 checksum and the file manifest the plugin uses to check itself.
#
# To release: bump the version (plugin header, WP2SS_VERSION, readme.txt
# Stable tag), add a CHANGELOG.md entry, and push to main.
#
# The WordPress.org edition (no GitHub updater) is then committed to
# WordPress.org SVN — trunk and tags/X.Y.Z — plus .wordpress-org/ assets.
# That job only runs once the SVN_USERNAME and SVN_PASSWORD repository
# secrets exist (set them after WordPress.org approves the plugin).
#
# 10up/action-wordpress-plugin-deploy 2.3.0 = 54bd289…
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      skip: ${{ steps.v.outputs.skip }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Read and check version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEADER=$(grep -m1 -E '^\s*\*\s*Version:' wp2shell-scanner.php | awk '{print $NF}')
          CONST=$(grep -m1 "define( 'WP2SS_VERSION'" wp2shell-scanner.php | grep -oE "[0-9]+\.[0-9]+\.[0-9]+[^']*")
          STABLE=$(grep -m1 -i '^Stable tag:' readme.txt | awk '{print $NF}')
          echo "header=$HEADER const=$CONST readme=$STABLE"
          if [ "$HEADER" != "$CONST" ] || [ "$HEADER" != "$STABLE" ]; then
            echo "::error::Versions disagree — plugin header $HEADER, WP2SS_VERSION $CONST, readme.txt $STABLE"; exit 1
          fi
          echo "version=$HEADER" >> "$GITHUB_OUTPUT"
          if gh release view "v$HEADER" >/dev/null 2>&1; then
            echo "Release v$HEADER already exists — nothing to do."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Build zip and manifest
        if: steps.v.outputs.skip != '1'
        run: |
          V="${{ steps.v.outputs.version }}"
          git archive --format=tar --prefix=wp2shell-scanner/ HEAD | tar -x -C "$RUNNER_TEMP"
          php .github/scripts/make-manifest.php "$RUNNER_TEMP/wp2shell-scanner" "$V"
          cp "$RUNNER_TEMP/wp2shell-scanner/manifest.json" manifest.json
          (cd "$RUNNER_TEMP" && zip -qr "$GITHUB_WORKSPACE/wp2shell-scanner.zip" wp2shell-scanner)
          unzip -l wp2shell-scanner.zip
          sha256sum wp2shell-scanner.zip > wp2shell-scanner.zip.sha256

      - name: Release notes from CHANGELOG.md
        if: steps.v.outputs.skip != '1'
        run: |
          # Exact match on "## [X.Y.Z]" (so 1.0.1 never matches 1.0.10).
          awk -v h="## [${{ steps.v.outputs.version }}]" '
            index($0, h) == 1 {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md" > notes.md
          cat notes.md

      - name: Publish release
        if: steps.v.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.v.outputs.version }}" \
            wp2shell-scanner.zip wp2shell-scanner.zip.sha256 manifest.json \
            --target "${{ github.event.workflow_run.head_sha }}" \
            --title "PHP2Shell & wp2shell Scanner v${{ steps.v.outputs.version }}" \
            --notes-file notes.md

  wporg:
    name: Deploy to WordPress.org
    needs: release
    if: needs.release.outputs.skip != '1'
    runs-on: ubuntu-latest
    steps:
      - name: Are WordPress.org SVN credentials set?
        id: creds
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
        run: |
          if [ -n "$SVN_USERNAME" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "::notice::SVN_USERNAME / SVN_PASSWORD not set — skipping the WordPress.org deploy."; fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        if: steps.creds.outputs.ok == '1'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Build the WordPress.org edition
        if: steps.creds.outputs.ok == '1'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq subversion
          bash .github/scripts/build-wporg.sh build

      - uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2
        if: steps.creds.outputs.ok == '1'
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: php2shell-scanner
          VERSION: ${{ needs.release.outputs.version }}
          BUILD_DIR: build/php2shell-scanner
          ASSETS_DIR: .wordpress-org
