name: Release

# Releases happen automatically: when CI passes on main and the plugin's
# version has no release yet, this tags vX.Y.Z and publishes the zip.
# So to release, bump the version (plugin header, WP2SS_VERSION, readme.txt
# Stable tag), add a CHANGELOG.md entry, and push to main.
# Pushing a vX.Y.Z tag yourself also works.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Read and check version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEADER=$(grep -m1 -E '^\s*\*\s*Version:' wp2shell-scanner.php | awk '{print $NF}')
          CONST=$(grep -m1 "define( 'WP2SS_VERSION'" wp2shell-scanner.php | grep -oE "[0-9]+\.[0-9]+\.[0-9]+[^']*")
          STABLE=$(grep -m1 -i '^Stable tag:' readme.txt | awk '{print $NF}')
          echo "header=$HEADER const=$CONST readme=$STABLE"
          if [ "$HEADER" != "$CONST" ] || [ "$HEADER" != "$STABLE" ]; then
            echo "::error::Versions disagree — plugin header $HEADER, WP2SS_VERSION $CONST, readme.txt $STABLE"; exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$HEADER" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match plugin version $HEADER"; exit 1
          fi
          echo "version=$HEADER" >> "$GITHUB_OUTPUT"
          if gh release view "v$HEADER" >/dev/null 2>&1; then
            echo "Release v$HEADER already exists — nothing to do."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint
        if: steps.v.outputs.skip != '1'
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Build zip
        if: steps.v.outputs.skip != '1'
        run: |
          git archive --format=zip --prefix=wp2shell-scanner/ -o wp2shell-scanner.zip HEAD
          unzip -l wp2shell-scanner.zip
          sha256sum wp2shell-scanner.zip > wp2shell-scanner.zip.sha256

      - name: Release notes from CHANGELOG.md
        if: steps.v.outputs.skip != '1'
        run: |
          awk -v v="${{ steps.v.outputs.version }}" '
            $0 ~ "^## \\[?" v "\\]?" {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md" > notes.md
          cat notes.md

      - name: Publish release
        if: steps.v.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.v.outputs.version }}" wp2shell-scanner.zip wp2shell-scanner.zip.sha256 \
            --target "$(git rev-parse HEAD)" \
            --title "wp2shell Scanner v${{ steps.v.outputs.version }}" \
            --notes-file notes.md
