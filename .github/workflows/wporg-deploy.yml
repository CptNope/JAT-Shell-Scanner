name: Deploy to WordPress.org

# Run by hand (Actions → Deploy to WordPress.org → Run workflow) to publish
# the current main branch to WordPress.org SVN: trunk, tags/X.Y.Z and the
# .wordpress-org/ assets. Use it for the first upload, or to redo a deploy.
# New versions are deployed automatically by release.yml.
#
# Needs the SVN_USERNAME and SVN_PASSWORD repository secrets.
#
# 10up/action-wordpress-plugin-deploy 2.3.0 = 54bd289…
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wporg-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to WordPress.org
    runs-on: ubuntu-latest
    steps:
      - name: Are WordPress.org SVN credentials set?
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: |
          if [ -z "$SVN_USERNAME" ] || [ -z "$SVN_PASSWORD" ]; then
            echo "::error::Add the SVN_USERNAME and SVN_PASSWORD repository secrets first (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5

      - name: Read version
        id: v
        run: |
          V=$(sed -n 's/^ \* Version: *//p' jat-shell-scanner.php | tr -d '[:space:]')
          echo "Deploying JAT Shell Scanner $V"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Build the WordPress.org edition
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq subversion
          bash .github/scripts/build-wporg.sh build

      - uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: jat-shell-scanner
          VERSION: ${{ steps.v.outputs.version }}
          BUILD_DIR: build/jat-shell-scanner
          ASSETS_DIR: .wordpress-org
